[project]
name = "lpf"
version = "0.1.0"
description = "llm-play-factorio: schematic renderer, blueprint codec, layout lint and simulator for LLM agent runs"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.1",
    "factorio-rcon-py>=0.0.4",   # render-area talks to the running game through ../../bridge
]

[project.scripts]
lpf = "lpf.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lpf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
